<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4A90E2">
<title>Minecraft Bounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    color: #111;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Mobile: disable pinch-zoom, double-tap zoom, pull-to-refresh,
       callout (text selection), highlight (tap flash on iOS) */
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: relative;
    /* Stage fills the entire viewport. The canvas inside is sized by
       JS (resizeGame) to match the viewport, so the game world
       extends to fill the device's play area on every screen.
       On very large desktop displays, the canvas is capped at the
       original 900x620 design size so the pixel art doesn't get
       absurdly big (a single tree would be 4x normal size). */
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    background: #4A90E2;
    box-shadow: 0 0 0 6px #1a1a1a, 0 0 60px rgba(0,0,0,0.6);
    image-rendering: pixelated;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    /* Scale the 900x620 internal canvas to fill the stage.
       The stage is sized via width + aspect-ratio, so when the
       viewport shrinks the stage shrinks, and so does the canvas. */
    width: 100%;
    height: 100%;
    /* Don't let the browser steal our taps for scroll/zoom.
       We handle jump on touchstart ourselves. */
    touch-action: none;
  }
  /* DOM button layer (overlays canvas) */
  #ui {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .btn {
    pointer-events: auto;
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    padding: 16px 28px;
    margin: 10px 0;
    background: #4A8AC7;
    color: #fff;
    border: 4px solid #1a1a1a;
    box-shadow: 0 6px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.2);
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.05s, box-shadow 0.05s, background 0.15s;
    text-transform: uppercase;
    /* Mobile: kill the 300ms tap delay on buttons.
       manipulation = disable double-tap zoom, allow panning.
       (Parent already has touch-action: none so this is belt+suspenders.) */
    touch-action: manipulation;
  }
  .btn:hover:not(.disabled) { background: #5A9AD7; }
  .btn:active:not(.disabled) {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.2);
  }
  .btn.disabled {
    background: #888;
    color: #ccc;
    cursor: not-allowed;
    box-shadow: 0 4px 0 #555, inset 0 -3px 0 rgba(0,0,0,0.2);
  }
  .hidden { display: none !important; }
  /* Nuke button: top-center of canvas, danger red */
  #btnNuke {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    pointer-events: auto;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    padding: 10px 18px;
    background: #C73E1D;
    color: #FFE066;
    border: 3px solid #1a1a1a;
    box-shadow: 0 4px 0 #1a1a1a, inset 0 -3px 0 rgba(0,0,0,0.25);
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    animation: nuke-pulse 1s ease-in-out infinite;
  }
  #btnNuke:hover { background: #E54E2D; }
  #btnNuke:active {
    transform: translateX(-50%) translateY(3px);
    box-shadow: 0 1px 0 #1a1a1a, inset 0 -3px 0 rgba(0,0,0,0.25);
  }
  @keyframes nuke-pulse {
    0%, 100% { box-shadow: 0 4px 0 #1a1a1a, 0 0 0 rgba(255,80,0,0); }
    50% { box-shadow: 0 4px 0 #1a1a1a, 0 0 12px rgba(255,80,0,0.8); }
  }
  /* Settings menu — overlay shown on top of the title screen */
  #settingsMenu {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .settingsPanel {
    background: #2A2A2A;
    border: 4px solid #1a1a1a;
    box-shadow: 0 8px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.3);
    padding: 30px 40px;
    min-width: 400px;
    max-width: 600px;
    text-align: center;
  }
  .settingsTitle {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: #fff;
    margin: 0 0 24px 0;
    letter-spacing: 2px;
  }
  .settingsBody {
    min-height: 100px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .settingsEmpty {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #888;
    margin: 0;
  }
  /* Setting row — label on the left, control on the right */
  .settingsRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 360px;
    margin: 12px 0;
    padding: 6px 4px;
    gap: 16px;
  }
  .settingsLabel {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #fff;
    text-align: left;
    line-height: 1.4;
    flex: 1;
  }
  /* Minecraft-style ON/OFF toggle (matches button style) */
  .toggle {
    font-family: 'Press Start 2P', monospace !important;
    font-size: 12px !important;
    padding: 8px 16px !important;
    min-width: 64px;
    border: 3px solid #1a1a1a !important;
    box-shadow: 0 4px 0 #1a1a1a !important;
    cursor: pointer !important;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: transform 0.05s, box-shadow 0.05s, background 0.15s;
  }
  .toggle.on {
    background: #4A8AC7 !important;  /* blue when ON */
    color: #fff !important;
  }
  .toggle.off {
    background: #666 !important;  /* gray when OFF */
    color: #ccc !important;
  }
  .toggle:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #1a1a1a !important;
  }
  /* Settings button on the title screen — same blue as other buttons,
     same font (Press Start 2P). Positioned absolutely in the top-right
     corner of the game stage so it doesn't take up space in the
     centered button column. */
  .btnGear {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 15;
    font-family: 'Press Start 2P', monospace !important;
    font-size: 14px !important;
    padding: 10px 16px !important;
    margin: 0 !important;
    background: #4A8AC7 !important;
    color: #fff !important;
    border: 4px solid #1a1a1a !important;
    box-shadow: 0 6px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.2) !important;
    cursor: pointer !important;
    letter-spacing: 1px !important;
    text-transform: uppercase !important;
    pointer-events: auto !important;
    transition: transform 0.05s, box-shadow 0.05s, background 0.15s !important;
  }
  .btnGear:hover { background: #5A9AD7 !important; }
  .btnGear:active {
    transform: translateY(4px) !important;
    box-shadow: 0 2px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.2) !important;
  }

  /* -------- MOBILE / small screens --------
     On desktop the stage is 900x620 (the game world's original size)
     centered in the page with a black box-shadow border.
     On mobile, the stage fills the entire viewport (no letterbox
     bars). The canvas inside is sized by JS (resizeGame) to match
     the viewport, so the game world extends in BOTH dimensions —
     the character still occupies the same proportional position
     (lower-left), and the extra area is filled with extended
     sky and ground scenery.

     We also bump button font/padding so tap targets stay above the
     44px accessibility floor. */
  @media (max-width: 600px) {
    #stage {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: auto;
      box-shadow: none;
    }
    .btn {
      font-size: 16px;
      padding: 12px 20px;
      margin: 8px 0;
      border: 4px solid #1a1a1a;
      box-shadow: 0 6px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.2);
    }
    .btn:active:not(.disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.2);
    }
    .btnGear {
      font-size: 12px !important;
      padding: 8px 12px !important;
      border: 3px solid #1a1a1a !important;
    }
    #btnNuke {
      font-size: 20px !important;
      padding: 16px 24px !important;
      border: 4px solid #1a1a1a !important;
      box-shadow: 0 6px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.25) !important;
    }
    #btnNuke:active {
      transform: translateX(-50%) translateY(4px) !important;
      box-shadow: 0 2px 0 #1a1a1a, inset 0 -4px 0 rgba(0,0,0,0.25) !important;
    }
    .settingsPanel {
      padding: 32px 24px;
      min-width: 0;
      max-width: 92%;
    }
    .settingsTitle { font-size: 24px; margin-bottom: 24px; }
    .settingsEmpty { font-size: 14px; }
    /* Death-screen buttons are created via JS (showDeathButtons).
       They use the .btn class so they get the bigger font automatically. */
  }
  /* Landscape mobile: stage fills the entire viewport. The canvas
     is sized by JS to match, so the game world extends horizontally
     with extra scenery on the sides. */
  @media (max-width: 900px) and (orientation: landscape) {
    #stage {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: auto;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="ui">
    <button id="btnChar" class="btn">Character Selector</button>
    <button id="btnPlay" class="btn disabled">Play</button>
    <!-- Settings gear button. In the static HTML so it's visible on
         the initial title screen (before the user has done anything).
         updateSettingsButton() in the script controls its visibility
         based on the current state. -->
    <button id="btnSettings" class="btnGear">⚙ Settings</button>
  </div>
  <button id="btnNuke" class="hidden">☢ NUKE</button>
  <!-- Settings menu overlay (initially hidden). Populated by JS when the
       user opens it. The exit button is the only interactive control
       for now; the user will add the real settings later. -->
  <div id="settingsMenu" class="hidden">
    <div class="settingsPanel">
      <h2 class="settingsTitle">SETTINGS</h2>
      <div class="settingsBody" id="settingsBody">
        <p class="settingsEmpty">No settings yet</p>
      </div>
      <button id="btnSettingsExit" class="btn">Exit</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  // Game world dimensions. These are dynamic — recalculated in
  // resizeGame() based on the actual viewport, so the game always
  // fills the device's play area (no letterbox bars on mobile).
  // The "minimum" sizes match the original 900x620 design so the
  // game never shrinks below its original size on a tiny viewport.
  const MIN_W = 900, MIN_H = 620;
  let W = MIN_W, H = MIN_H;
  // Ground sits at ~77% from the top (same ratio as the original
  // 480/620 = 0.774). Scales with H so the playable area always
  // has the same proportions on any screen.
  let GROUND_Y = Math.round(MIN_H * 0.774);   // 480
  const GRAVITY = 0.5;
  const JUMP_V = -12;
  const DBL_JUMP_V = -10;
  const PLAYER_W = 32, PLAYER_H = 64;
  // Player x position is a ratio of the canvas width so the character
  // stays at the same relative horizontal position regardless of
  // viewport size (~13% from the left, like the original 120/900).
  const PLAYER_X_RATIO = 0.133;
  let PLAYER_X = Math.round(MIN_W * PLAYER_X_RATIO);  // 120
  // Called on init and on window resize to make the canvas match the
  // viewport. Resizes the internal buffer, recomputes W/H, and recenters
  // the player's x position.
  function resizeGame() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    // Canvas internal buffer = viewport size. No minimum — we want
    // the game world to fit the device perfectly, even on narrow
    // phones where the playable area is small. The character, ground,
    // and obstacles all scale with W/H so everything stays
    // proportional.
    W = vw;
    H = vh;
    GROUND_Y = Math.round(H * 0.774);
    PLAYER_X = Math.round(W * PLAYER_X_RATIO);
    canvas.width = W;
    canvas.height = H;
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', () => {
    resizeGame();
    // After resize, the player's y position depends on the new
    // GROUND_Y, so snap them to the ground in case they were mid-air.
    if (typeof player !== 'undefined' && state === 'game') {
      player.y = GROUND_Y - PLAYER_H;
    }
  });
  resizeGame();  // set initial size before any drawing happens

  // -------- STATE --------
  let state = 'title'; // 'title' | 'select' | 'game' | 'death'
  let selectedChar = null; // 'steve' | 'alex'
  let score = 0;
  let speedMult = 1.0;
  let obstacles = [];
  let clouds = [];
  let particles = [];
  let nextSpawnX = W;
  let spawnDelay = 90; // 1.5 seconds before first obstacle
  let groundOffset = 0;
  let deathT = 0;          // 0..1 progress of death animation
  let deathDuration = 90;  // frames (~1.5s at 60fps)
  // -------- EASTER EGG STATE --------
  // Toggled by clicking the "M" in the "MINECRAFT" logo on the title screen.
  // When active, the player auto-equips tools to defeat obstacles instead
  // of dying: sword vs mobs, axe vs trees, flint & steel vs creepers.
  let easterEgg = false;
  // Animation/effect state for the easter egg
  let playerItem = null;       // 'sword' | 'axe' | 'flint_steel' | null
  let playerItemTimer = 0;     // frames the item is shown
  let swingT = 0;              // 0..1 progress of a tool swing
  let swinging = false;        // true while a swing animation is playing
  let mobDeaths = [];          // {x, y, rot, type, t} for dying mobs
  let fallingTrees = [];       // {x, y, type, rot, t, dropping} falling trees
  let woodDrops = [];          // {x, y, vx, vy, life, age} wood pickups
  let explosions = [];         // creeper explosions {x, y, t, r}
  let woodCollected = 0;       // total wood blocks the player has picked up
  // UNO REVERSE easter egg (skeleton-on-skeleton warfare)
  // When a skeleton is near (but not in striking range) the player pulls
  // out an UNO reverse card. The skeleton turns around, shoots itself
  // rapidly for ~3 seconds, then dies. The world is paused during this.
  let unoReverseActive = false;
  let unoReverseT = 0;          // frames since the reverse card was shown
  let unoReverseTarget = null;  // the skeleton being attacked
  const UNO_REVERSE_DURATION = 180;  // 3 seconds at 60fps
  const UNO_SHOOT_INTERVAL = 5;      // shoot every N frames
  const UNO_TRIGGER_RANGE_MIN = 80;   // closer than this = strike
  const UNO_TRIGGER_RANGE_MAX = 180;  // farther than this = not yet
  // NUKE easter egg (kill-everything button at the top of the screen)
  // When clicked, a nuke falls from the top, freezes the world, blows up
  // every obstacle/mob/tree, and spawns a huge particle burst that
  // fades away over 4 seconds (240 frames).
  let nukeActive = false;
  let nukeT = 0;                 // frames since nuke was triggered
  let nukeFalling = true;        // true while nuke is falling
  const NUKE_FALL_DURATION = 30; // ~0.5s for the nuke to fall
  // After the boom, the post-boom sequence is:
  //  1. Big explosion (instant)
  //  2. Orange screen for 1 second (60 frames)
  //  3. Particles fall through the floor and fade out, while the title
  //     screen is visible underneath. This takes 6 seconds (360 frames).
  //  4. State resets to 'title' so the player can play again.
  const NUKE_ORANGE_DURATION = 60;   // 1 second of orange screen
  const NUKE_FADE_DURATION = 360;    // 6 seconds for particles to fall through floor
  const NUKE_POST_TOTAL = NUKE_ORANGE_DURATION + NUKE_FADE_DURATION; // 420 = 7s
  let nukePostT = 0;
  const nukeParticles = [];      // explosion particles with per-particle fade
  let gameRunning = false;
  let lastTime = 0;
  let spacePressed = false;
  let spaceWasPressed = false;
  let onGround = true;
  let doubleJumped = false;

  const player = {
    x: 120,
    y: GROUND_Y - PLAYER_H,
    vy: 0,
    w: PLAYER_W, h: PLAYER_H,
    rotation: 0
  };

  // -------- STRUCTURE BUILD (every 50 score points) --------
  // BLOCK is the pixel size of a single Minecraft block in this game.
  // Sized so 5-6 block wide structures fit comfortably on screen.
  const BLOCK = 14;
  // Building state. When buildingStructure !== null, the world is frozen
  // and the player navigates the structure to build it block-by-block,
  // then walks through it.
  let buildingStructure = null;        // current structure index
  let buildBlockIndex = 0;             // which block we're placing
  let buildPlacedBlocks = [];          // blocks already placed (copies)
  let buildPhase = 'idle';             // 'walk_to_base' | 'build' | 'walk_to_entry' | 'enter' | 'walk_through' | 'walk_to_exit' | 'exit' | 'done'
  let buildT = 0;                      // frames in current phase
  let buildTargetX = 0, buildTargetY = 0; // where the player is heading
  let buildEntryDoorOpen = 0;          // 0-1 (0=closed, 1=open)
  let buildExitDoorOpen = 0;           // 0-1
  // Where the structure is anchored (left edge x, baseline y)
  let buildOriginX = 0, buildOriginY = 0;
  // The list of structures, ordered by score threshold.
  // Each structure defines:
  //   threshold  — score at which it builds
  //   name       — display label
  //   width      — pixel width of bounding box
  //   height     — pixel height of bounding box
  //   blocks     — list of {x, y, color, w, h, type} (x, y in block units)
  //                where (0,0) is the bottom-left of the structure.
  //                y values increase UPWARD (we flip when drawing).
  //   entryDoor  — {x, y, w, h} position of entry door (in block units)
  //   exitDoor   — {x, y, w, h} position of exit door
  // The player builds blocks bottom-up, left-to-right.
  const STRUCTURES = [
    // 50 — small oak house
    {
      threshold: 50, name: 'Small Oak House', width: 6, height: 6,
      blocks: [
        // floor
        {x:0,y:0,c:'#8B6F3F'},{x:1,y:0,c:'#8B6F3F'},{x:2,y:0,c:'#8B6F3F'},{x:3,y:0,c:'#8B6F3F'},{x:4,y:0,c:'#8B6F3F'},{x:5,y:0,c:'#8B6F3F'},
        // walls (oak plank with darker stripes for visual interest)
        {x:0,y:1,c:'#A57E55'},{x:1,y:1,c:'#8B6F3F'},{x:2,y:1,c:'#A57E55'},{x:3,y:1,c:'#8B6F3F'},{x:4,y:1,c:'#A57E55'},{x:5,y:1,c:'#8B6F3F'},
        {x:0,y:2,c:'#8B6F3F'},{x:1,y:2,c:'#A57E55'},{x:2,y:2,c:'#8B6F3F'},{x:3,y:2,c:'#A57E55'},{x:4,y:2,c:'#8B6F3F'},{x:5,y:2,c:'#A57E55'},
        {x:0,y:3,c:'#A57E55'},{x:1,y:3,c:'#8B6F3F'},{x:2,y:3,c:'#A57E55'},{x:3,y:3,c:'#8B6F3F'},{x:4,y:3,c:'#A57E55'},{x:5,y:3,c:'#8B6F3F'},
        {x:0,y:4,c:'#8B6F3F'},{x:1,y:4,c:'#A57E55'},{x:2,y:4,c:'#8B6F3F'},{x:3,y:4,c:'#A57E55'},{x:4,y:4,c:'#8B6F3F'},{x:5,y:4,c:'#A57E55'},
        // roof
        {x:0,y:5,c:'#5C3A1E'},{x:1,y:5,c:'#7C5A2E'},{x:2,y:5,c:'#5C3A1E'},{x:3,y:5,c:'#7C5A2E'},{x:4,y:5,c:'#5C3A1E'},{x:5,y:5,c:'#7C5A2E'},
      ],
      entryDoor: {x:-1, y:1, w:1, h:2, side:'left'},
      exitDoor: {x:6, y:2, w:1, h:2, side:'right'}
    },
    // 100 — cobblestone tower
    {
      threshold: 100, name: 'Cobblestone Tower', width: 5, height: 7,
      blocks: [
        // base (full row)
        {x:0,y:0,c:'#6E6E6E'},{x:1,y:0,c:'#7E7E7E'},{x:2,y:0,c:'#6E6E6E'},{x:3,y:0,c:'#7E7E7E'},{x:4,y:0,c:'#6E6E6E'},
        // middle solid layer
        {x:0,y:1,c:'#5E5E5E'},{x:1,y:1,c:'#7E7E7E'},{x:2,y:1,c:'#6E6E6E'},{x:3,y:1,c:'#5E5E5E'},{x:4,y:1,c:'#7E7E7E'},
        // walls
        {x:0,y:2,c:'#6E6E6E'},{x:4,y:2,c:'#5E5E5E'},
        {x:0,y:3,c:'#7E7E7E'},{x:4,y:3,c:'#6E6E6E'},
        {x:0,y:4,c:'#5E5E5E'},{x:4,y:4,c:'#7E7E7E'},
        {x:0,y:5,c:'#6E6E6E'},{x:4,y:5,c:'#5E5E5E'},
        // top — crenellations
        {x:0,y:6,c:'#5E5E5E'},{x:2,y:6,c:'#7E7E7E'},{x:4,y:6,c:'#6E6E6E'},
      ],
      entryDoor: {x:-1, y:2, w:1, h:2, side:'left'},
      exitDoor: {x:5, y:4, w:1, h:2, side:'right'}
    },
    // 150 — village church (steeple)
    {
      threshold: 150, name: 'Village Church', width: 5, height: 8,

    red: '#D04040',
    yellow: '#F0C040'
  };

  // -------- DRAWING PRIMITIVES --------
  function fillRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }
  function px(x, y, c) { fillRect(x, y, 1, 1, c); }

  // -------- BACKGROUND SCENE (for title/death overlays) --------
  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, COL.sky1);
    grad.addColorStop(1, COL.sky2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, GROUND_Y);
  }
  function drawClouds() {
    for (const c of clouds) {
      fillRect(c.x, c.y, 60, 14, COL.cloud);
      fillRect(c.x + 8, c.y - 6, 30, 8, COL.cloud);
      fillRect(c.x + 30, c.y - 4, 40, 10, COL.cloud);
    }
  }
  function drawHills() {
    // Far hills
    fillRect(0, GROUND_Y - 30, W, 30, '#5D8C3A');
    fillRect(0, GROUND_Y - 30, W, 4, '#3D6B2A');
    // Distant trees on hills (decorative)
    drawDecoTree(80, GROUND_Y - 50, 0.7);
    drawDecoTree(280, GROUND_Y - 45, 0.65);
    drawDecoTree(540, GROUND_Y - 50, 0.7);
    drawDecoTree(760, GROUND_Y - 45, 0.65);
  }
  function drawDecoTree(x, baseY, scale) {
    // Trunk
    fillRect(x - 4 * scale, baseY, 8 * scale, 20 * scale, COL.oakTrunk);
    // Leaves
    const lx = x - 20 * scale, ly = baseY - 30 * scale;
    fillRect(lx, ly, 40 * scale, 30 * scale, COL.oakLeaf);
    fillRect(lx + 4 * scale, ly - 6 * scale, 32 * scale, 8 * scale, COL.oakLeaf);
    fillRect(lx, ly + 26 * scale, 40 * scale, 6 * scale, COL.oakLeafDk);
  }
  function drawGround() {
    // Grass top
    fillRect(0, GROUND_Y, W, 8, COL.grassTop);
    fillRect(0, GROUND_Y, W, 2, COL.grassDark);
    // Dirt below
    fillRect(0, GROUND_Y + 8, W, H - GROUND_Y - 8, COL.grassDirt);
    // Grass blades poking up
    for (let x = ((groundOffset % 16) - 16); x < W; x += 16) {
      fillRect(x, GROUND_Y - 2, 2, 3, COL.grassTop);
      fillRect(x + 8, GROUND_Y - 1, 2, 2, COL.grassDark);
    }
  }
  function drawTitleScene() {
    drawSky();
    drawClouds();
    drawHills();
    drawGround();
  }

  // -------- CHARACTER SPRITES (pixel art, 8x12 grid scaled) --------
  // We'll draw at native pixel scale then scale up. Define a function for each character.
  // Pixel grid: 8 wide x 12 tall. Each "pixel" = 4 canvas pixels. So sprite is 32x48, but we
  // make them 32x64 with head/legs balanced. Easier: use a 8x16 grid and scale 4x = 32x64.

  // I'll draw directly with fillRect at 4px-per-pixel to match PLAYER_W x PLAYER_H (32x64).
  function drawSteve(px, py) {
    // 8x16 grid → scale 4 → 32x64
    const S = 4;
    // Head (rows 0-3, cols 2-5)
    // Skin
    fillRect(px + 8,  py,    16, 16, COL.steveSkin);
    // Eyes (white + black)
    fillRect(px + 12, py + 6,  2, 2, '#fff');
    fillRect(px + 18, py + 6,  2, 2, '#fff');
    fillRect(px + 12, py + 6,  1, 1, '#000');
    fillRect(px + 18, py + 6,  1, 1, '#000');
    // Mouth
    fillRect(px + 14, py + 12, 4, 1, COL.steveSkinDk);
    // Hair (top)
    fillRect(px + 8,  py,    16, 4, COL.steveHair);
    fillRect(px + 6,  py,     2, 8, COL.steveHair);
    fillRect(px + 24, py,     2, 8, COL.steveHair);
    // Body (shirt) rows 4-9
    fillRect(px + 8,  py + 16, 16, 20, COL.steveShirt);
    // Arms
    fillRect(px + 4,  py + 16, 4, 20, COL.steveShirt);
    fillRect(px + 24, py + 16, 4, 20, COL.steveShirt);
    // Hands
    fillRect(px + 4,  py + 32, 4, 4, COL.steveSkin);
    fillRect(px + 24, py + 32, 4, 4, COL.steveSkin);

    fillRect(px + 8,  py + 36, 16, 1, '#1E3F7B');

  function drawAlex(px, py) {

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
    ctx.rotate(player.rotation);
    if (selectedChar === 'steve') drawSteve(-player.w / 2, -player.h / 2);
    else drawAlex(-player.w / 2, -player.h / 2);
    ctx.restore();
    // Easter-egg tool: drawn AFTER the player so it appears in front
    if (easterEgg && playerItem && state === 'game') {
      ctx.save();
      ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
      // Swing animation: rotate the arm
      const swingAngle = swinging ? Math.sin(swingT * Math.PI) * 1.2 : 0;
      ctx.rotate(swingAngle);
      // Tool is held in front of the player (to the right), offset so the
      // larger tools stay in front of the body, not behind it
      const toolX = 8;
      const toolY = -22;
      if (playerItem === 'sword') {
        drawSword(toolX, toolY);
      } else if (playerItem === 'axe') {
        drawAxe(toolX, toolY);
      } else if (playerItem === 'flint_steel') {
        drawFlintSteel(toolX, toolY);
      } else if (playerItem === 'uno_reverse') {
        // Wobble the card a little for emphasis
        const wobble = Math.sin(unoReverseT * 0.3) * 2;
        drawUnoReverse(toolX + wobble, toolY);
      }
      ctx.restore();
    }
  }
