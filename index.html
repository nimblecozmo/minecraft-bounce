  // -------- NO-BLOOD DEATH PUFF --------
  // The no-blood version of the game shows a small gray "poof" of
  // particles when the character dies, instead of a big blood explosion.
  function spawnDeathPuff(x, y) {
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 2;
      particles.push({
        x: x + (Math.random() - 0.5) * 8,
        y: y + (Math.random() - 0.5) * 8,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 50 + Math.floor(Math.random() * 20),
        age: 0,
        col: '#888888',  // gray smoke
        size: 3
      });
    }
  }

  // -------- OBSTACLE TYPE FACTORY --------
  function spawnObstacle() {
    const r = Math.random();
    let type;
    if (r < 0.5) type = Math.random() < 0.5 ? 'oak' : 'birch';
    else type = Math.random() < 0.33 ? 'zombie' : Math.random() < 0.5 ? 'skeleton' : 'creeper';
    let w, h, y;
    if (type === 'oak' || type === 'birch') {
      w = 48; h = 110;
      y = GROUND_Y - h;  // root at ground
    } else {
      w = 32; h = 64;
      y = GROUND_Y - h;
    }
    obstacles.push({ type, x: W + 50, y, w, h, scored: false });
  }

  // -------- GAME LOOP --------
  function resetGame() {
    obstacles = [];
    particles = [];
    score = 0;
    speedMult = 1.0;
    nextSpawnX = W + 200;
    spawnDelay = 90;
    groundOffset = 0;
    player.x = PLAYER_X;
    player.y = GROUND_Y - PLAYER_H;
    player.vy = 0;
    player.rotation = 0;
    onGround = true;
    doubleJumped = false;
    deathT = 0;
    // Reset easter-egg state (the toggle itself persists across games)
    playerItem = null;
    playerItemTimer = 0;
    swingT = 0;
    swinging = false;
    mobDeaths = [];
    fallingTrees = [];
    woodDrops = [];
    explosions = [];
    woodCollected = 0;
    unoReverseActive = false;
    unoReverseT = 0;
    unoReverseTarget = null;
    nukeActive = false;
    nukeT = 0;
    nukeFalling = true;
    nukePostT = 0;
    nukeParticles.length = 0;
    // Reset structure build state so a new game starts fresh at score 0
    buildingStructure = null;
    builtStructures.clear();
    nextBuildScore = 50;
    buildBlockIndex = 0;
    buildPlacedBlocks = [];
    buildPhase = 'idle';
    buildT = 0;
    buildEntryDoorOpen = 0;
    buildExitDoorOpen = 0;
  }
  function initClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 100, vx: 0.2 + Math.random() * 0.3 });
    }
  }
  initClouds();

  function update(dt) {
    if (state === 'game') {
      // STRUCTURE BUILD: when score crosses a 50-point threshold, trigger
      // the build. The build takes over the player and freezes the world.
      // Each build picks a random unbuilt structure so the player sees
      // different ones each game.
      if (!buildingStructure) {
        const pending = pendingStructure();
        if (pending) {
          triggerBuild(pending.structure);
          builtStructures.add(pending.index);
          nextBuildScore += 50;
        }
      }
      // While a build is in progress, only run build updates — skip the
      // normal gameplay (no obstacle movement, no scoring, no death).
      if (buildingStructure) {
        updateBuild();
        return;
      }
      // UNO REVERSE: detect a skeleton in the trigger range and freeze the world
      if (easterEgg && !unoReverseActive) {
        for (const o of obstacles) {
          if (o._easterEggConsumed) continue;
          if (o.type !== 'skeleton') continue;
          const d = o.x - (player.x + player.w);
          if (d >= UNO_TRIGGER_RANGE_MIN && d <= UNO_TRIGGER_RANGE_MAX) {
            unoReverseActive = true;
            unoReverseT = 0;
            unoReverseTarget = o;
            o._unoFlipped = true;  // mark for the skeleton draw function
            break;
          }
        }
      }
      // NUKE update: when the nuke is active, advance its phase timer and
      // trigger the explosion at the end of the fall.
      if (nukeActive) {
        nukeT++;
        // After the fall, advance the post-boom timer too
        if (nukeT > NUKE_FALL_DURATION) nukePostT++;
        if (nukeFalling && nukeT === NUKE_FALL_DURATION) {
          // BOOM! Detonate: kill every obstacle, spawn a HUGE particle
          // burst, then begin the fade-out.
          nukeFalling = false;
          nukePostT = 0;  // reset post-boom timer to start the orange phase fresh
          // Mark every obstacle as nuked (gives score too)
          for (const o of obstacles) {
            if (o._easterEggConsumed) continue;
            // Big death: every mob/creeper/tree gets the death animation
            if (o.type === 'oak' || o.type === 'birch') {
              fallingTrees.push({
                x: o.x, y: o.y, w: o.w, h: o.h, type: o.type, t: 0
              });
            } else {
              mobDeaths.push({
                x: o.x, y: o.y, w: o.w, h: o.h, type: o.type, t: 0
              });
              // Nuke-killed mobs: white particles, same style as
              // character death
              const cx = o.x + o.w/2;
              const cy = o.y + 10;
              for (let i = 0; i < 10; i++) {
                particles.push({
                  x: cx,
                  y: cy,
                  vx: (Math.random() - 0.5) * 1.2,
                  vy: -1 - Math.random() * 1.5,
                  life: 60,
                  age: 0,
                  col: '#FFFFFF',
                  size: 3
                });
              }
            }
            o._easterEggConsumed = true;
            if (!o.scored) {
              score += 2;
              o.scored = true;
            }
          }
          obstacles = obstacles.filter(o => !o._easterEggConsumed);
          // Massive explosion particles — ~80 of them, each with its own
          // staggered fade time so they disappear one by one over 4 sec.
          const colors = ['#FF0000', '#FF8C00', '#FFD700', '#FF4500', '#FFFF00', '#FFFFFF', '#888888'];
          for (let i = 0; i < 80; i++) {
            const angle = (Math.PI * 2 * i) / 80 + Math.random() * 0.3;
            const speed = 2 + Math.random() * 3;  // less spread so they fall cleanly
            nukeParticles.push({
              x: W / 2 + (Math.random() - 0.5) * 60,
              y: GROUND_Y - 40 + (Math.random() - 0.5) * 40,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 1.0,  // small upward bias
              size: 4 + Math.floor(Math.random() * 5),
              col: colors[Math.floor(Math.random() * colors.length)],
              // Per-particle fade: each one disappears at a different time
              // over the 6-second (360 frame) fall-and-fade window, so they
              // vanish one by one. fadeStart is 0-320 so each particle's
              // 30-frame fade ends before the 6-sec window closes.
              fadeStart: Math.floor(Math.random() * 320),
              age: 0
            });
          }
          // Clear any other death animations / explosions
          mobDeaths.length = 0;
          fallingTrees.length = 0;
          explosions.length = 0;
          // Big ground explosion (a single big one)
          explosions.push({ x: W / 2, y: GROUND_Y - 20, t: 0, r: 30 });
        }
        if (nukeT >= NUKE_FALL_DURATION + NUKE_POST_TOTAL) {
          // Nuke is done — switch to the title screen so the player can play again
          nukeActive = false;
          nukeT = 0;
          nukeFalling = true;
          nukePostT = 0;
          nukeParticles.length = 0;
          state = 'title';
          // Reset the game world so a fresh round can begin
          resetGame();
          // Show the title screen buttons (Character Selector + Play)
          hideUI();
          showUI();
          restoreTitleButtons();
          updateNukeButton();
          updateSettingsButton();
        }
      }
      // While the UNO reverse effect OR the nuke is playing, freeze the world
      const worldFrozen = unoReverseActive || nukeActive;
      // World scroll (parallax clouds slower)
      if (!worldFrozen) {
        for (const c of clouds) {
          c.x -= c.vx * speedMult;
          if (c.x < -80) { c.x = W + Math.random() * 200; c.y = 40 + Math.random() * 100; }
        }
        groundOffset += 2.5 * speedMult;
      }
      // Player physics (jump still works during UNO for fun)
      player.vy += GRAVITY;
      player.y += player.vy;
      if (player.y >= GROUND_Y - PLAYER_H) {
        player.y = GROUND_Y - PLAYER_H;
        player.vy = 0;
        onGround = true;
        doubleJumped = false;
      } else {
        onGround = false;
      }
      // Spawn obstacles — only one per frame, and only when current obstacles
      // have moved far enough left to make room. The first obstacle is
      // delayed by spawnDelay frames so the player has time to react.
      // The spawn delay does NOT short-circuit the easter-egg check below,
      // so the player can still defend themselves even during the lead-in.
      // Also: don't spawn while the world is frozen (UNO reverse in progress).
      if (!worldFrozen) {
        spawnDelay = Math.max(0, spawnDelay - 1);
        if (spawnDelay > 0) {
          // Still run easter-egg logic during the lead-in
        } else {
          const rightmost = obstacles.length ? Math.max(...obstacles.map(o => o.x)) : 0;
          const minGap = 450;
          if (obstacles.length === 0) {
            spawnObstacle();
          } else if (rightmost < W + 50 && (W + 200) - rightmost > minGap) {
            spawnObstacle();
          }
          // Move obstacles
          for (const o of obstacles) o.x -= 2.5 * speedMult;
          // Remove off-screen
          obstacles = obstacles.filter(o => {
            if (o.x + o.w < 0) {
              if (!o.scored) { score++; o.scored = true; }
              return false;
            }
            return true;
          });
        }
      }
      // Speed up (capped at 1.4× starting speed for a more relaxed feel)
      speedMult = Math.min(1.4, 1.0 + score / 250);
      // Easter-egg proximity detection: when active, decide which tool
      // the player should be holding based on the closest upcoming obstacle.
      if (easterEgg) {
        // UNO REVERSE overrides the normal item display
        if (unoReverseActive && unoReverseTarget) {
          playerItem = 'uno_reverse';
          // Skeleton shoots itself every UNO_SHOOT_INTERVAL frames
          if (unoReverseT % UNO_SHOOT_INTERVAL === 0) {
            // Skeleton fires an arrow from its own body outward (in the
            // direction it's now facing - away from the player)
            const sx = unoReverseTarget.x + unoReverseTarget.w / 2;
            const sy = unoReverseTarget.y + unoReverseTarget.h * 0.3;
            // Sparks: arrow flies RIGHT (away from player, into nothing)
            // but we spawn a "self-hit" spark on the skeleton at the same time
            for (let i = 0; i < 3; i++) {
              particles.push({
                x: sx + (Math.random() - 0.5) * 8,
                y: sy + (Math.random() - 0.5) * 8,
                vx: 1 + Math.random() * 1.5,  // flying away from player
                vy: (Math.random() - 0.5) * 1.5,
                life: 25,
                age: 0,
                col: '#FFD700',  // gold sparks (self-shot)
                size: 3
              });
            }
            // Tiny smoke puff on the skeleton's bow side
            particles.push({
              x: sx,
              y: sy,
              vx: 0.5,
              vy: -0.5,
              life: 20,
              age: 0,
              col: '#AAAAAA',
              size: 5
            });
            // Recoil shake
            player._unoShake = (player._unoShake || 0) + 1;
          }
          // After the duration, kill the skeleton with a Minecraft death
          if (unoReverseT >= UNO_REVERSE_DURATION) {
            const o = unoReverseTarget;
            mobDeaths.push({
              x: o.x, y: o.y, w: o.w, h: o.h, type: o.type, t: 0
            });
            // White death particles (no-blood version, same style as
            // character death)
            const cx = o.x + o.w / 2;
            const cy = o.y + 10;
            for (let i = 0; i < 15; i++) {
              particles.push({
                x: cx, y: cy,
                vx: (Math.random() - 0.5) * 1.2,
                vy: -1 - Math.random() * 1.5,
                life: 60, age: 0,
                col: '#FFFFFF',
                size: 3
              });
            }
            o._easterEggConsumed = true;
            if (!o.scored) {
              score += 2;  // bonus for UNO reverse (skeleton is harder)
              o.scored = true;
            }
            // Big "UNO REVERSE!" flash particles (white in the
            // no-blood version, to match the character death style)
            for (let i = 0; i < 8; i++) {
              const angle = (Math.PI * 2 * i) / 8;
              particles.push({
                x: cx, y: cy,
                vx: Math.cos(angle) * 3,
                vy: Math.sin(angle) * 3,
                life: 50, age: 0,
                col: '#FFFFFF',
                size: 4
              });
            }
            // Reset UNO state
            unoReverseActive = false;
            unoReverseT = 0;
            unoReverseTarget = null;
            playerItem = null;
          } else {
            unoReverseT++;
          }
        } else {
          const strikeRange = 80;     // px from player to trigger a swing
          const itemShowRange = 180;  // px to start showing the tool
          let nearest = null;
          let nearestDist = Infinity;
          for (const o of obstacles) {
            if (o.x + o.w < player.x) continue;  // already passed
            // Don't strike skeletons - they trigger the UNO reverse instead
            if (o._easterEggConsumed) continue;
            const d = o.x - (player.x + player.w);
            if (d < nearestDist) { nearestDist = d; nearest = o; }
          }
          if (nearest) {
            if (nearest.type === 'oak' || nearest.type === 'birch') {
              playerItem = 'axe';
            } else if (nearest.type === 'creeper') {
              playerItem = 'flint_steel';
            } else if (nearest.type === 'skeleton') {
              // Skeleton: only show the sword if it's actually in striking range
              // (otherwise the UNO reverse card will be the item)
              if (nearestDist < strikeRange) {
                playerItem = 'sword';
              } else {
                playerItem = null;
              }
            } else {
              playerItem = 'sword';
            }
            // Trigger a swing when the obstacle is in striking range
            if (nearestDist < strikeRange && !swinging) {
              swinging = true;
              swingT = 0;
              // Spawn the appropriate effect
              const o = nearest;
              if (o.type === 'oak' || o.type === 'birch') {
                // Tree falls: rotation 0 → 90°
                fallingTrees.push({
                  x: o.x, y: o.y, w: o.w, h: o.h, type: o.type, t: 0
                });
                // Schedule wood drops after the tree falls (~30 frames)
              } else if (o.type === 'creeper') {
                // Creeper explodes
                explosions.push({
                  x: o.x + o.w/2, y: o.y + o.h/2, t: 0
                });
                // Spawn explosion particles (orange/yellow firework-like)
                const cx = o.x + o.w/2;
                const cy = o.y + o.h/2;
                const colors = ['#FF8C00', '#FFA500', '#FFD700', '#FF4500', '#FFFF00'];
                for (let i = 0; i < 20; i++) {
                  const angle = (Math.PI * 2 * i) / 20 + Math.random() * 0.3;
                  const speed = 2 + Math.random() * 2;
                  particles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 35,
                    age: 0,
                  col: colors[Math.floor(Math.random() * colors.length)],
                  size: 4
                });
              }
              // Smoke particles (gray, going up)
              for (let i = 0; i < 8; i++) {
                particles.push({
                  x: cx + (Math.random() - 0.5) * 20,
                  y: cy,
                  vx: (Math.random() - 0.5) * 1.5,
                  vy: -1 - Math.random(),
                  life: 50,
                  age: 0,
                  col: '#666666',
                  size: 6
                });
              }
            } else {
              // Mob dies (Minecraft death: rotate + white particles,
              // same as the character death style)
              mobDeaths.push({
                x: o.x, y: o.y, w: o.w, h: o.h, type: o.type, t: 0
              });
              // Spawn white particles — matching the character death
              // style: small white particles that float upward.
              const cx = o.x + o.w/2;
              const cy = o.y + 10;  // start near the top of the mob
              for (let i = 0; i < 15; i++) {
                particles.push({
                  x: cx,
                  y: cy,
                  vx: (Math.random() - 0.5) * 1.2,
                  vy: -1 - Math.random() * 1.5,
                  life: 60,
                  age: 0,
                  col: '#FFFFFF',
                  size: 3
                });
              }
            }
            // Mark the obstacle for removal
            o._easterEggConsumed = true;
            // Reward the player for defeating it
            if (!o.scored) {
              score++;
              o.scored = true;
              // Bonus for creepers and trees
              if (o.type === 'creeper') score += 2;
              else if (o.type === 'oak' || o.type === 'birch') score += 1;
            }
          }
        } else {
          // No nearby obstacles — show the item briefly if it was just used
          if (playerItemTimer > 0) playerItemTimer--;
          else playerItem = null;
        }
        // Remove consumed obstacles
        obstacles = obstacles.filter(o => !o._easterEggConsumed);
      }
      } else {
        playerItem = null;
      }
      // Swing animation progress
      if (swinging) {
        swingT += 0.08;
        if (swingT >= 1) {
          swingT = 0;
          swinging = false;
        }
      }
      // Update falling trees
      for (const ft of fallingTrees) {
        ft.t++;
        ft.rot = (Math.PI / 2) * Math.min(1, ft.t / 30);
        if (ft.t === 30) {
          // Spawn wood drops at the trunk
          const dropX = ft.x + ft.w/2 - 6;
          const dropY = ft.y + ft.h - 12;
          woodDrops.push({
            x: dropX, y: dropY, vx: 0.4, vy: -4, life: 240, age: 0
          });
          woodDrops.push({
            x: dropX - 8, y: dropY - 4, vx: -0.2, vy: -3.5, life: 240, age: 0
          });
        }
      }
      fallingTrees = fallingTrees.filter(ft => ft.t < 90);
      // Update wood drops (gravity, then auto-pickup when near player)
      for (const w of woodDrops) {
        w.age++;
        w.vy += 0.18;
        w.x += w.vx;
        w.y += w.vy;
        // Auto-pickup when close to player
        const pcx = player.x + player.w/2;
        const pcy = player.y + player.h/2;
        const dx = pcx - (w.x + 4);
        const dy = pcy - (w.y + 4);
        const dist = Math.hypot(dx, dy);
        if (dist < 30) {
          w.vx = dx * 0.2;
          w.vy = dy * 0.2;
        } else if (w.y > GROUND_Y - 8) {
          w.y = GROUND_Y - 8;
          w.vy = 0;
          w.vx *= 0.8;
        }
        // Pickup: when close enough, remove the drop and spawn sparkles
        if (dist < 8 && !w._picked) {
          w._picked = true;
          woodCollected++;
          // Spawn a small burst of brown/gold sparkle particles
          for (let i = 0; i < 6; i++) {
            particles.push({
              x: w.x + 4,
              y: w.y + 4,
              vx: (Math.random() - 0.5) * 2,
              vy: -1 - Math.random() * 2,
              life: 30,
              age: 0,
              col: i % 2 ? '#C19A6B' : '#FFD700',
              size: 3
            });
          }
          w.life = 0; // mark for removal on next filter
        }
      }
      woodDrops = woodDrops.filter(w => w.age < w.life);
      // Update mob deaths
      for (const m of mobDeaths) {
        m.t++;
        m.rot = (Math.PI / 2) * Math.min(1, m.t / 30);
      }
      mobDeaths = mobDeaths.filter(m => m.t < 60);
      // Update explosions
      for (const e of explosions) {
        e.t++;
        e.r = 20 + e.t * 3;
      }
      explosions = explosions.filter(e => e.t < 30);
      // Collision (skip obstacles that have been consumed by the easter egg,
      // or are currently being UNO-reversed — they cannot hurt the player)
      const pBox = {
        x: player.x + 4, y: player.y + 4, w: player.w - 8, h: player.h - 4
      };
      for (const o of obstacles) {
        if (o._easterEggConsumed) continue;
        if (o._unoFlipped) continue;  // UNO-reversed skeletons can't hurt you
        const oBox = { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 8 };
        if (pBox.x < oBox.x + oBox.w && pBox.x + pBox.w > oBox.x &&
            pBox.y < oBox.y + oBox.h && pBox.y + pBox.h > oBox.y) {
          // Character death (no-blood version: just a small gray puff,
          // no blood explosion)
          spawnDeathPuff(player.x + player.w/2, player.y + player.h/2);
          triggerDeath();
          break;
        }
      }
    } else if (state === 'death') {
      // Death animation
      if (deathT < deathDuration) {
        deathT++;
        const t = deathT / deathDuration; // 0..1
        player.rotation = (Math.PI / 2) * t;
        // Spawn particles
        if (deathT % 2 === 0) {
          particles.push({
            x: player.x + player.w / 2,
            y: player.y + 10,
            vx: (Math.random() - 0.5) * 1.2,
            vy: -1 - Math.random() * 1.5,
            life: 60,
            age: 0,
            col: '#FFFFFF',
            size: 3
          });
        }
      }
    }
    // Update particles every frame (so easter-egg particles and death
    // particles animate smoothly regardless of state)
    for (const p of particles) {
      p.age++;
      p.x += p.vx;
      p.y += p.vy;
      p.vy -= 0.02;  // mild "float up" for white death particles
    }
    particles = particles.filter(p => p.age < p.life);
    // Update nuke particles (fall through the floor under gravity,
    // no air drag — they keep falling until they fade away).
    for (const p of nukeParticles) {
      p.age++;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;  // strong gravity pulls them down through the floor
    }
  }

  // ============================================================
  // STRUCTURE BUILD (every 50 score points)
  // ============================================================
  // Called when score crosses a 50-point threshold. Sets up the
  // building state and freezes the world. The updateBuild() function
  // takes over player movement each frame.
  function triggerBuild(structure) {
    buildingStructure = structure;
    buildBlockIndex = 0;
    buildPlacedBlocks = [];
    buildPhase = 'walk_to_base';
    buildT = 0;
    buildEntryDoorOpen = 0;
    buildExitDoorOpen = 0;
    // Position the structure in front of the player.
    // Player is at x=120. Place structure ~150px to the right of them,
    // on the ground.
    buildOriginX = player.x + player.w + 80;
    buildOriginY = GROUND_Y;  // baseline of structure
    // Target: stand just to the left of the structure's left edge
    buildTargetX = buildOriginX - player.w - 6;
    buildTargetY = GROUND_Y - PLAYER_H;
    // Reset player to standing position (no jump, on ground)
    player.vy = 0;
    player.y = GROUND_Y - PLAYER_H;
  }

  // Find the next pending structure to build. Returns a random unbuilt
  // structure if the score has crossed the next 50-point milestone,
  // otherwise null. Each structure only builds once per game.
  function pendingStructure() {
    // Has the player passed the next milestone?
    if (score < nextBuildScore) return null;
    // All structures built?
    if (builtStructures.size >= STRUCTURES.length) return null;
    // Pick a random unbuilt structure
    const available = [];
    for (let i = 0; i < STRUCTURES.length; i++) {
      if (!builtStructures.has(i)) available.push(i);
    }
    if (available.length === 0) return null;
    const idx = available[Math.floor(Math.random() * available.length)];
    return { structure: STRUCTURES[idx], index: idx };
  }

  // Sort blocks so the player builds bottom-up, left-to-right.
  function sortedBlocks(structure) {
    return structure.blocks.slice().sort((a, b) => {
      if (a.y !== b.y) return a.y - b.y;
      return a.x - b.x;
    });
  }

  // Convert block-unit coords to screen coords.
  // Block (0,0) is the bottom-left of the structure.
  // We flip y so y=0 is at the bottom of the structure.
  function blockToScreen(bx, by, structure) {
    return {
      x: buildOriginX + bx * BLOCK,
      y: buildOriginY - (by + 1) * BLOCK  // y increases upward
    };
  }

  // Update logic for the build phase. Called every frame when
  // buildingStructure is set.
  function updateBuild() {
    const s = buildingStructure;
    if (!s) return;
    buildT++;
    // Player moves at 2.5 px/frame while building (slow, deliberate)
    const SPEED = 2.5;
    // Helper: move the player toward (tx, ty). During build, the player
    // moves freely in 2D (no gravity) so they can climb the structure.
    function moveToward(tx, ty) {
      const dx = tx - player.x;
      const dy = ty - player.y;
      // Snap if very close
      if (Math.abs(dx) <= SPEED && Math.abs(dy) <= SPEED) {
        player.x = tx;
        player.y = ty;
        return;
      }
      // Move toward target at SPEED per frame (diagonal moves use full SPEED)
      if (Math.abs(dx) > Math.abs(dy)) {
        player.x += Math.sign(dx) * SPEED;
        if (Math.abs(dy) > 0) player.y += Math.sign(dy) * SPEED;
      } else {
        player.y += Math.sign(dy) * SPEED;
        if (Math.abs(dx) > 0) player.x += Math.sign(dx) * SPEED;
      }
    }

    if (buildPhase === 'walk_to_base') {
      // Walk to a position just left of the structure
      moveToward(buildTargetX, buildTargetY);
      if (Math.abs(player.x - buildTargetX) <= 2 && Math.abs(player.y - buildTargetY) <= 2) {
        buildPhase = 'build';
        buildT = 0;
      }
    } else if (buildPhase === 'build') {
      // Walk to next block position, then place it
      const blocks = sortedBlocks(s);
      if (buildBlockIndex < blocks.length) {
        const b = blocks[buildBlockIndex];
        const pos = blockToScreen(b.x, b.y, s);
        // Target: stand at the block's position, at ground level
        // (we use a fixed y for all blocks during build, but shift the
        // target y upward as the structure grows so the player "climbs")
        const targetX = pos.x + BLOCK / 2 - player.w / 2;
        // As blocks get higher, the target y goes up so the player
        // visually climbs the structure. We use a small portion of the
        // block height so the player doesn't fly off-screen.
        const climbAmount = Math.min(b.y * 4, 32);  // up to 32px of "climb"
        const targetY = GROUND_Y - PLAYER_H - climbAmount;
        moveToward(targetX, targetY);
        // Once at the target, place the block
        if (Math.abs(player.x - targetX) <= 3 && Math.abs(player.y - targetY) <= 3) {
          buildPlacedBlocks.push({ ...b });
          buildBlockIndex++;
          buildT = 0;
        }
      } else {
        // Done building — move to entry door
        buildPhase = 'walk_to_entry';
        buildT = 0;
      }
    } else if (buildPhase === 'walk_to_entry') {
      // Walk to a position just to the LEFT of the entry door (outside
      // the structure). The door is at x=-1 (block-units) on the left
      // side, so we position the player just left of that.
      const doorLeftX = buildOriginX + s.entryDoor.x * BLOCK;
      const entryX = doorLeftX - player.w - 4;
      const entryY = buildOriginY - (s.entryDoor.y + s.entryDoor.h) * BLOCK;
      moveToward(entryX, entryY);
      // Open the door (animate over 20 frames)
      if (buildEntryDoorOpen < 1) buildEntryDoorOpen = Math.min(1, buildEntryDoorOpen + 0.05);
      if (Math.abs(player.x - entryX) <= 3 && Math.abs(player.y - entryY) <= 3) {
        buildPhase = 'walk_through';
        buildT = 0;
      }
    } else if (buildPhase === 'walk_through') {
      // Walk through the building, passing through the entry door,
      // past the center, and to a position just LEFT of the exit door
      const doorRightX = buildOriginX + s.exitDoor.x * BLOCK;
      const exitX = doorRightX - player.w - 4;
      const exitY = buildOriginY - (s.exitDoor.y + s.exitDoor.h) * BLOCK;
      moveToward(exitX, exitY);
      if (buildEntryDoorOpen < 1) buildEntryDoorOpen = 1;
      if (Math.abs(player.x - exitX) <= 3 && Math.abs(player.y - exitY) <= 3) {
        buildPhase = 'exit';
        buildT = 0;
      }
    } else if (buildPhase === 'exit') {
      // Open the exit door and walk past it (to the right of the structure)
      const doorRightX = buildOriginX + s.exitDoor.x * BLOCK;
      const exitX = doorRightX + 30;
      const exitY = buildOriginY - (s.exitDoor.y + s.exitDoor.h) * BLOCK;
      moveToward(exitX, exitY);
      if (buildExitDoorOpen < 1) buildExitDoorOpen = Math.min(1, buildExitDoorOpen + 0.05);
      if (Math.abs(player.x - exitX) <= 3 && Math.abs(player.y - exitY) <= 3) {
        buildPhase = 'done';
        buildT = 0;
      }
    } else if (buildPhase === 'done') {
      // Build complete — clean up and let the game continue
      buildingStructure = null;
      // (builtStructures set already updated when the build started;
      // nextBuildScore already advanced to the next 50-point milestone)
      // Reset player position to the left side of the screen
      player.x = PLAYER_X;
      player.y = GROUND_Y - PLAYER_H;
      player.vy = 0;
      // Clear the obstacles on screen so the player gets a clean start
      // (structures don't persist in the world)
      obstacles = [];
      // Push the next obstacle spawn out so the player has a moment to react
      nextSpawnX = W + 200;
      spawnDelay = 60;
    }
  }

  // Draw the structure being built (and the placed blocks so far).
  function drawBuildStructure() {
    const s = buildingStructure;
    if (!s) return;
    // Draw placed blocks (so they appear progressively)
    for (const b of buildPlacedBlocks) {
      const pos = blockToScreen(b.x, b.y, s);
      // Add a slight pixel-art "block" look: face color + edge highlight
      ctx.fillStyle = b.c;
      ctx.fillRect(pos.x, pos.y, BLOCK, BLOCK);
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(pos.x, pos.y + BLOCK - 2, BLOCK, 2);  // bottom shadow
      ctx.fillRect(pos.x + BLOCK - 2, pos.y, 2, BLOCK);  // right shadow
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(pos.x, pos.y, BLOCK, 2);  // top highlight
      ctx.fillRect(pos.x, pos.y, 2, BLOCK);  // left highlight
    }
    // Draw entry door (open or closed)
    drawBuildDoor(s.entryDoor, buildEntryDoorOpen);
    // Draw exit door (open or closed)
    drawBuildDoor(s.exitDoor, buildExitDoorOpen);
    // Structure name label
    if (buildPlacedBlocks.length > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      const labelText = s.name;
      ctx.font = "12px 'Press Start 2P', monospace";
      const tw = ctx.measureText(labelText).width;
      const labelX = buildOriginX + (s.width * BLOCK) / 2 - tw / 2 - 6;
      const labelY = buildOriginY - s.height * BLOCK - 30;
      ctx.fillRect(labelX, labelY, tw + 12, 22);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.fillText(labelText, labelX + 6, labelY + 16);
    }
  }

  function drawBuildDoor(door, openness) {
    if (!door) return;
    const s = buildingStructure;
    // Door position (in block coords)
    const x = buildOriginX + door.x * BLOCK;
    const y = buildOriginY - door.y * BLOCK;
    const w = door.w * BLOCK;
    const h = door.h * BLOCK;
    if (door.side === 'left') {
      // Door swings inward (toward the right). When closed, it covers the
      // opening. When open, it rotates away.
      const pivotX = x + w;
      const pivotY = y;
      const angle = openness * Math.PI / 2;  // 0 to 90 degrees
      ctx.save();
      ctx.translate(pivotX, pivotY);
      ctx.rotate(-angle);  // rotate the door outward
      // Draw the door
      ctx.fillStyle = '#6E4A1E';
      ctx.fillRect(-w, -h, w, h);
      // Door handle
      ctx.fillStyle = '#D8B85A';
      ctx.fillRect(-w * 0.3, -h * 0.5, 3, 3);
      ctx.restore();
    } else {
      // Right-side door swings inward (toward the left)
      const pivotX = x;
      const pivotY = y;
      const angle = openness * Math.PI / 2;
      ctx.save();
      ctx.translate(pivotX, pivotY);
      ctx.rotate(angle);
      ctx.fillStyle = '#6E4A1E';
      ctx.fillRect(0, -h, w, h);
      ctx.fillStyle = '#D8B85A';
      ctx.fillRect(w * 0.7, -h * 0.5, 3, 3);
      ctx.restore();
    }
  }

  function triggerDeath() {
    state = 'death';
    deathT = 0;
    particles = [];
    // Always rebuild the death screen buttons when the player dies.
    // Don't check for "any button" because the title buttons (Character
    // Selector / Play) are still in the DOM (just hidden via CSS) and
    // would prevent us from creating the death buttons. The buttons
    // created here REPLACE the existing ones in the DOM via innerHTML=''.
    showDeathButtons();
    updateNukeButton();
    updateSettingsButton();
  }

  function drawGameScene() {
    drawSky();
    drawClouds();
    drawHills();
    drawGround();
    // Obstacles
    for (const o of obstacles) {
      if (o.type === 'oak') drawOakTree(o.x, o.y);
      else if (o.type === 'birch') drawBirchTree(o.x, o.y);
      else if (o.type === 'zombie') drawZombie(o.x, o.y);
      else if (o.type === 'skeleton') {
        // During UNO reverse, flip the skeleton to face away (showing its back)
        if (o._unoFlipped) {
          ctx.save();
          ctx.translate(o.x + o.w / 2, o.y);
          ctx.scale(-1, 1);
          drawSkeleton(-o.w / 2, 0);
          ctx.restore();
          // Add a small "REVERSED!" speech-bubble above the skeleton
          ctx.fillStyle = '#fff';
          ctx.font = "10px 'Press Start 2P', monospace";
          ctx.textAlign = 'center';
          ctx.fillText('?!?!', o.x + o.w / 2, o.y - 8);
        } else {
          drawSkeleton(o.x, o.y);
        }
      }
      else if (o.type === 'creeper') drawCreeper(o.x, o.y);
    }
    // Easter-egg effects: falling trees, dying mobs, explosions, wood drops
    if (easterEgg) {
      for (const ft of fallingTrees) {
        ctx.save();
        ctx.translate(ft.x + ft.w/2, GROUND_Y);
        ctx.rotate(ft.rot);
        if (ft.type === 'oak') drawOakTree(-ft.w/2, -ft.h);
        else drawBirchTree(-ft.w/2, -ft.h);
        ctx.restore();
      }
      for (const m of mobDeaths) {
        ctx.save();
        ctx.translate(m.x + m.w/2, m.y + m.h/2);
        ctx.rotate(m.rot);
        if (m.type === 'zombie') drawZombie(-m.w/2, -m.h/2);
        else if (m.type === 'skeleton') drawSkeleton(-m.w/2, -m.h/2);
        else if (m.type === 'creeper') drawCreeper(-m.w/2, -m.h/2);
        ctx.restore();
      }
      for (const w of woodDrops) {
        // Wood block: brown square with darker outline
        fillRect(w.x, w.y, 8, 8, '#8B6F3F');
        fillRect(w.x, w.y, 8, 2, '#6E4A2E');
        fillRect(w.x, w.y, 2, 8, '#6E4A2E');
      }
    }  // end if (easterEgg)
    for (const e of explosions) {
        // Expanding explosion: outer red/orange ring + white center
        const alpha = 1 - e.t / 30;
        ctx.fillStyle = `rgba(255,200,0,${alpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,100,0,${alpha * 0.7})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,255,200,${alpha})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }
    drawPlayer();
    // Structure being built (shown over the ground but the player is
    // drawn on top so it looks like they're inside/around the structure)
    if (buildingStructure) {
      drawBuildStructure();
    }
    // Particles (drawn on top of everything except the HUD)
    for (const p of particles) {
      const alpha = 1 - p.age / p.life;
      const size = p.size || 3;
      const r = parseInt((p.col || '#FFFFFF').slice(1, 3), 16);
      const g = parseInt((p.col || '#FFFFFF').slice(3, 5), 16);
      const b = parseInt((p.col || '#FFFFFF').slice(5, 7), 16);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fillRect(p.x, p.y, size, size);
    }
    // HUD
    drawScore();
    // UNO REVERSE overlay (only while the effect is active)
    if (unoReverseActive) {
      const t = unoReverseT;
      // Bounce in for the first 20 frames
      let scale = 1;
      if (t < 20) {
        const p = t / 20;
        // Bounce: 1.5 → 1.0
        scale = 1.5 - Math.sin(p * Math.PI) * 0.5;
      }
      // Fade in for first 10 frames, hold, fade out for last 30
      let alpha = 1;
      if (t < 10) alpha = t / 10;
      else if (t > UNO_REVERSE_DURATION - 30) alpha = (UNO_REVERSE_DURATION - t) / 30;
      alpha = Math.max(0, Math.min(1, alpha));
      ctx.save();
      ctx.translate(W / 2, 150);
      ctx.scale(scale, scale);
      // Black shadow
      ctx.font = "32px 'Press Start 2P', monospace";
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(0,0,0,${alpha})`;
      ctx.fillText('UNO REVERSE!', 4, 4);
      // Red main text
      ctx.fillStyle = `rgba(255,0,0,${alpha})`;
      ctx.fillText('UNO REVERSE!', 0, 0);
      // Yellow stroke
      ctx.strokeStyle = `rgba(255,215,0,${alpha})`;
      ctx.lineWidth = 2;
      ctx.strokeText('UNO REVERSE!', 0, 0);
      ctx.restore();
    }
    // Note: the nuke overlay (particles, screen flash, etc.) is drawn by
    // render() AFTER drawGameScene() so it can persist when the state
    // switches to 'title' (so particles keep falling on top of the title).
  }

  function drawNuke() {
    // Phase 1: nuke is falling (first NUKE_FALL_DURATION frames)
    if (nukeFalling) {
      // Nuke starts above the screen and falls toward the ground
      const startY = -40;
      const endY = GROUND_Y - 80;
      const t = nukeT / NUKE_FALL_DURATION;
      const nukeY = startY + (endY - startY) * t;
      // Trail (smoke behind the nuke)
      ctx.fillStyle = 'rgba(80,80,80,0.4)';
      for (let i = 1; i <= 5; i++) {
        const trailY = nukeY - i * 8;
        if (trailY > 0) {
          ctx.fillRect(W/2 - 4, trailY, 8 + i, 4);
        }
      }
      // Nuke body (a dark sphere with a radiation symbol)
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(W/2 - 16, nukeY, 32, 32);
      ctx.fillStyle = '#333';
      ctx.fillRect(W/2 - 14, nukeY + 2, 28, 4);  // highlight
      // Radiation trefoil (yellow on dark)
      ctx.fillStyle = '#FFE066';
      ctx.fillRect(W/2 - 2, nukeY + 6, 4, 14);  // center stem
      ctx.fillRect(W/2 - 8, nukeY + 10, 4, 10);  // left blade
      ctx.fillRect(W/2 + 4, nukeY + 10, 4, 10);  // right blade
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(W/2 - 2, nukeY + 18, 4, 4);  // center dot
      // Glow
      ctx.fillStyle = `rgba(255,255,150,${0.3 + 0.3 * Math.sin(nukeT * 0.5)})`;
      ctx.beginPath();
      ctx.arc(W/2, nukeY + 16, 30, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    // Phase 2: explosion! Uses nukePostT (0 = boom frame, advances each frame after).
    // The post-boom sequence is 1 sec orange + 6 sec particles = 7 sec total.
    const postT = nukePostT;  // frames since the boom (0 on boom frame)
    // White flash on the very first frame after detonation
    if (postT === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fillRect(0, 0, W, H);
    }
    // Orange screen: held at full intensity for 1 second (60 frames).
    // No fade-out — when the orange phase ends, the title screen appears.
    if (postT < 60) {
      const tintAlpha = 0.6;
      ctx.fillStyle = `rgba(255,100,0,${tintAlpha})`;
      ctx.fillRect(0, 0, W, H);
    } else {
      // Once orange ends, draw the title screen underneath so it shows
      // through the falling particles. The title is fully revealed when
      // all particles have fallen away.
      drawTitle();
    }
    // Expanding shockwave ring (visible during the orange phase, ~60 frames)
    if (postT < 60) {
      const ringR = 30 + postT * 8;
      const ringAlpha = Math.max(0, 1 - postT / 60);
      if (ringAlpha > 0) {
        ctx.strokeStyle = `rgba(255,255,200,${ringAlpha})`;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(W/2, GROUND_Y - 20, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }
    // Nuke particles — each has its own fadeStart (0-320) and a 30-frame
    // fade-out window. They fall through the floor under gravity and
    // vanish one by one over the 6-sec fade phase (postT 60 → 420).
    for (const p of nukeParticles) {
      // Only show particles during the 6-second fall-and-fade phase (after orange)
      const localFade = postT - 60;            // 0 at start of fade phase
      if (localFade < p.fadeStart) continue;   // not yet visible
      if (localFade > p.fadeStart + 30) continue;  // already faded out
      const localAge = localFade - p.fadeStart;
      const alpha = 1 - localAge / 30;
      // Parse the hex color
      const r = parseInt(p.col.slice(1, 3), 16);
      const g = parseInt(p.col.slice(3, 5), 16);
      const b = parseInt(p.col.slice(5, 7), 16);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    // "NUKE!" text during the orange phase (first 60 frames after boom)
    if (postT < 60) {
      const textAlpha = Math.max(0, 1 - postT / 60);
      // Shake offset
      const shake = postT < 10 ? (Math.random() - 0.5) * 8 : 0;
      // Nuke text scales with canvas width (was 48px on 900w — 5.3%)
      const nukeSize = Math.max(24, Math.round(W * 0.053));
      ctx.save();
      ctx.translate(W/2 + shake, 200 + shake / 2);
      ctx.font = `${nukeSize}px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';
      // Black shadow
      ctx.fillStyle = `rgba(0,0,0,${textAlpha})`;
      ctx.fillText('NUKE!', 4, 4);
      // Red text
      ctx.fillStyle = `rgba(255,50,0,${textAlpha})`;
      ctx.fillText('NUKE!', 0, 0);
      // Yellow stroke
      ctx.strokeStyle = `rgba(255,215,0,${textAlpha})`;
      ctx.lineWidth = 2;
      ctx.strokeText('NUKE!', 0, 0);
      ctx.restore();
    }
  }

  function drawScore() {
    // Score HUD is in the top-right corner. Width scales with canvas
    // size (was 180px on 900w — 20% of W). Position is 20px from the
    // right edge and 20px from the top.
    const hudW = Math.max(120, Math.round(W * 0.22));
    const hudH = Math.max(36, Math.round(hudW * 0.28));
    const hudRight = W - 20;
    const hudTop = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(hudRight - hudW, hudTop, hudW, hudH);
    fillRect(hudRight - hudW + 2, hudTop + 2, hudW - 4, hudH - 4, '#1a1a1a');
    const scoreSize = Math.max(12, Math.round(W * 0.022));
    ctx.fillStyle = '#fff';
    ctx.font = `${scoreSize}px 'Press Start 2P', monospace`;
    ctx.textAlign = 'right';
    ctx.fillText('SCORE: ' + score, hudRight - 10, hudTop + Math.round(hudH * 0.66));
    // Easter-egg HUD indicator (top-left)
    if (easterEgg) {
      // Pulse alpha for visual interest
      const pulse = 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 300));
      // Easter-egg HUD scales with canvas size too
      const eggW = Math.max(160, Math.round(W * 0.27));
      const eggH = Math.max(36, Math.round(eggW * 0.21));
      const eggLeft = 20;
      const eggTop = 20;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(eggLeft, eggTop, eggW, eggH);
      fillRect(eggLeft + 2, eggTop + 2, eggW - 4, eggH - 4, '#1a1a1a');
      // Gold border to make it pop
      ctx.fillStyle = `rgba(255,215,0,${pulse})`;
      ctx.fillRect(eggLeft + 2, eggTop + 2, eggW - 4, 2);
      ctx.fillRect(eggLeft + 2, eggTop + 2, 2, eggH - 4);
      ctx.fillRect(eggLeft + eggW - 4, eggTop + 2, 2, eggH - 4);
      ctx.fillRect(eggLeft + 2, eggTop + eggH - 4, eggW - 4, 2);
      // Label sizes scale with HUD width
      const eggLabelSize = Math.max(7, Math.round(eggW * 0.042));
      const eggCountSize = Math.max(8, Math.round(eggW * 0.05));
      // Label
      ctx.textAlign = 'left';
      ctx.font = `${eggLabelSize}px 'Press Start 2P', monospace`;
      ctx.fillStyle = `rgba(255,215,0,${pulse})`;
      ctx.fillText('EASTER EGG', eggLeft + 12, eggTop + Math.round(eggH * 0.4));
      ctx.fillStyle = '#fff';
      ctx.fillText('TOOL MASTER ON', eggLeft + 12, eggTop + Math.round(eggH * 0.78));
      // Wood counter (only show if > 0)
      if (woodCollected > 0) {
        // Wood icon (small brown square) + count. Icon size scales too.
        const iconSize = Math.max(10, Math.round(eggW * 0.06));
        const iconX = eggLeft + Math.round(eggW * 0.66);
        const iconY = eggTop + Math.round(eggH * 0.25);
        fillRect(iconX, iconY, iconSize, iconSize, '#8B6F3F');
        fillRect(iconX, iconY, iconSize, Math.max(2, Math.round(iconSize * 0.2)), '#6E4A2E');
        fillRect(iconX, iconY, Math.max(2, Math.round(iconSize * 0.2)), iconSize, '#6E4A2E');
        ctx.font = `${eggCountSize}px 'Press Start 2P', monospace`;
        ctx.fillStyle = '#FFD700';
        ctx.textAlign = 'left';
        ctx.fillText('x' + woodCollected, iconX + iconSize + 4, iconY + iconSize - 2);
      }
    }
  }

  // -------- TITLE / DEATH OVERLAYS --------
  function drawTitle() {
    drawTitleScene();
    // Overlay
    ctx.fillStyle = COL.overlay;
    ctx.fillRect(0, 0, W, H);
    // Logo with shadow. Font size scales with the canvas width so the
    // title fits on narrow phones (was originally 64px on a 900px
    // canvas — 600+px wide, way too big for a 390px phone screen).
    // We use 7% of the canvas width as the logo font size, capped at
    // 64px (original) so it doesn't get absurdly large on big desktops.
    const logoSize = Math.max(24, Math.min(64, Math.round(W * 0.07)));
    const subSize = Math.max(10, Math.min(16, Math.round(W * 0.018)));
    const selSize = Math.max(8, Math.min(12, Math.round(W * 0.014)));
    // Logo with shadow
    ctx.textAlign = 'center';
    ctx.font = `${logoSize}px 'Press Start 2P', monospace`;
    ctx.fillStyle = '#000';
    // Title y positions scale with logo size. (Original used y=130, 200
    // with a 64px font — so 0.41 * logoSize for MINECRAFT, 1.09 * for BOUNCE.)
    const mineY = Math.round(logoSize * 2.0);  // was 130 = 64*2.03
    const bounceY = mineY + Math.round(logoSize * 1.1);  // was 200 = 130+70
    ctx.fillText('MINECRAFT', W/2, mineY);
    ctx.fillText('BOUNCE', W/2, bounceY);
    ctx.fillStyle = '#3D8B2C';
    ctx.fillText('MINECRAFT', W/2 + 4, mineY + 4);
    ctx.fillText('BOUNCE', W/2 + 4, bounceY + 4);
    // Subtitle
    ctx.font = `${subSize}px 'Press Start 2P', monospace`;
    ctx.fillStyle = '#222';
    ctx.fillText('A DODGING ADVENTURE', W/2, bounceY + Math.round(logoSize * 0.78));
    // Show selected char mini next to PLAY
    if (selectedChar) {
      ctx.font = `${selSize}px 'Press Start 2P', monospace`;
      ctx.fillStyle = '#000';
      ctx.fillText('SELECTED: ' + selectedChar.toUpperCase(), W/2, bounceY + Math.round(logoSize * 1.4));
    }
    // Easter-egg indicator: a glowing gold sparkle next to the "M" if active
    if (easterEgg) {
      // Pulse the gold sparkles using sin() for visual interest
      const pulse = 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 250));
      // Measure the M's left edge so we can place the sparkle beside it
      ctx.font = `${logoSize}px 'Press Start 2P', monospace`;
      const logoWidth = ctx.measureText('MINECRAFT').width;
      const logoLeft = (W - logoWidth) / 2;
      // Sparkle positions scale with the logo size so the decoration
      // stays beside the "M" regardless of viewport.
      // (Original used 76,80,70,90 with a 64px font.)
      const sparkleScale = logoSize / 64;
      const sparkleCx = logoLeft - 16 * sparkleScale;
      const sparkleCy = 76 * sparkleScale;
      // Draw a 4-point starburst sparkle (a 4-pointed star with pulses)
      // Main diamond
      ctx.fillStyle = `rgba(255,215,0,${pulse})`;
      ctx.fillRect(sparkleCx, sparkleCy, 10 * sparkleScale, 10 * sparkleScale);
      // Star points
      ctx.fillStyle = `rgba(255,235,80,${pulse})`;
      ctx.fillRect(sparkleCx - 6 * sparkleScale, sparkleCy + 4 * sparkleScale, 4 * sparkleScale, 2 * sparkleScale);   // left point
      ctx.fillRect(sparkleCx + 14 * sparkleScale, sparkleCy + 4 * sparkleScale, 4 * sparkleScale, 2 * sparkleScale);  // right point
      ctx.fillRect(sparkleCx + 4 * sparkleScale, sparkleCy - 6 * sparkleScale, 2 * sparkleScale, 4 * sparkleScale);   // top point
      ctx.fillRect(sparkleCx + 4 * sparkleScale, sparkleCy + 14 * sparkleScale, 2 * sparkleScale, 4 * sparkleScale);  // bottom point
      // Tiny twinkles
      ctx.fillStyle = `rgba(255,255,150,${pulse * 0.8})`;
      ctx.fillRect(sparkleCx - 10 * sparkleScale, sparkleCy + 2 * sparkleScale, 2 * sparkleScale, 2 * sparkleScale);
      ctx.fillRect(sparkleCx + 10 * sparkleScale, sparkleCy + 16 * sparkleScale, 2 * sparkleScale, 2 * sparkleScale);
      // Small text below the logo — scales with subSize, positioned
      // relative to bounceY (the BOUNCE text y position)
      const eggActiveSize = Math.max(8, Math.min(12, subSize));
      ctx.font = `${eggActiveSize}px 'Press Start 2P', monospace`;
      ctx.fillStyle = `rgba(80,50,0,${pulse})`;
      ctx.textAlign = 'center';
      ctx.fillText('EASTER EGG ACTIVE', W/2, bounceY + Math.round(logoSize * 0.78));
      ctx.textAlign = 'center';
    }
  }
  function drawSelector() {
    drawTitleScene();
    ctx.fillStyle = COL.overlay;
    ctx.fillRect(0, 0, W, H);
    // Header scales with canvas width (was 40px on 900px canvas —
    // 40/900 ≈ 4.4% of W). Minimum 20px so it stays readable.
    const headerSize = Math.max(20, Math.round(W * 0.044));
    ctx.textAlign = 'center';
    ctx.font = `${headerSize}px 'Press Start 2P', monospace`;
    ctx.fillStyle = '#000';
    ctx.fillText('CHOOSE YOUR', W/2, 90);
    ctx.fillText('CHARACTER', W/2, 140);
    // Two character cards. Card positions and sizes scale with the
    // canvas width so the layout works on any screen from a 390px
    // phone to a 4K display. Cards are 30% of W wide and centered
    // with a 5% gap between them.
    const cardW = Math.round(W * 0.3);
    const cardGap = Math.round(W * 0.05);
    const totalW = cardW * 2 + cardGap;
    const cardLeft = (W - totalW) / 2;
    const cardTop = 200;
    const cardH = Math.round(cardW * 1.45);  // maintain 220:320 ratio
    drawCharCard(cardLeft, cardTop, cardW, cardH, 'STEVE', 'steve', 'CLASSIC');
    drawCharCard(cardLeft + cardW + cardGap, cardTop, cardW, cardH, 'ALEX', 'alex', 'ADVENTURER');
  }
  function drawCharCard(x, y, w, h, name, charKey, tag) {
    // Card bg
    fillRect(x, y, w, h, '#1a1a1a');
    fillRect(x + 4, y + 4, w - 8, h - 8, '#DCDCC0');
    if (selectedChar === charKey) {
      // Highlighted border
      fillRect(x - 4, y - 4, w + 8, 6, COL.yellow);
      fillRect(x - 4, y + h - 2, w + 8, 6, COL.yellow);
      fillRect(x - 4, y - 4, 6, h + 8, COL.yellow);
      fillRect(x + w - 2, y - 4, 6, h + 8, COL.yellow);
    }
    // Character preview area
    const cx = x + w/2 - 32;
    const cy = y + 50;
    if (charKey === 'steve') drawSteve(cx, cy);
    else drawAlex(cx, cy);
    // Name, tag, and click hint scale with card width
    const nameSize = Math.max(14, Math.round(w * 0.13));   // was 28px on 220w
    const tagSize = Math.max(8, Math.round(w * 0.055));    // was 12px on 220w
    const hintSize = Math.max(9, Math.round(w * 0.064));   // was 14px on 220w
    // Name
    ctx.fillStyle = '#000';
    ctx.font = `${nameSize}px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(name, x + w/2, y + 200);
    // Tag
    ctx.font = `${tagSize}px 'Press Start 2P', monospace`;
    ctx.fillStyle = '#444';
    ctx.fillText(tag, x + w/2, y + 230);
    // Selected indicator
    if (selectedChar === charKey) {
      ctx.fillStyle = COL.yellow;
      ctx.font = `${hintSize}px 'Press Start 2P', monospace`;
      ctx.fillText('SELECTED', x + w/2, y + h - 20);
    } else {
      ctx.fillStyle = '#1a1a1a';
      ctx.font = `${hintSize}px 'Press Start 2P', monospace`;
      ctx.fillText('CLICK TO PICK', x + w/2, y + h - 20);
    }
  }
  function drawDeath() {
    // Same scene, then darker overlay
    drawGameScene(); // scene still visible
    ctx.fillStyle = COL.deathOverlay;
    ctx.fillRect(0, 0, W, H);
    // Particles (use stored color/size if present, else white 3px)
    for (const p of particles) {
      const alpha = 1 - p.age / p.life;
      const size = p.size || 3;
      const r = parseInt((p.col || '#FFFFFF').slice(1, 3), 16);
      const g = parseInt((p.col || '#FFFFFF').slice(3, 5), 16);
      const b = parseInt((p.col || '#FFFFFF').slice(5, 7), 16);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fillRect(p.x, p.y, size, size);
    }
    // Wait for animation to finish, then show death screen
    if (deathT >= deathDuration) {
      // Death-screen text scales with canvas size (was 72px on 900w)
      const diedSize = Math.max(28, Math.round(W * 0.08));
      const scoreSize = Math.max(12, Math.round(W * 0.022));
      ctx.textAlign = 'center';
      ctx.font = `${diedSize}px 'Press Start 2P', monospace`;
      ctx.fillStyle = '#000';
      ctx.fillText('YOU DIED!', W/2 + 4, 84);
      ctx.fillStyle = COL.red;
      ctx.fillText('YOU DIED!', W/2, 80);
      ctx.font = `${scoreSize}px 'Press Start 2P', monospace`;
      ctx.fillStyle = '#fff';
      ctx.fillText('SCORE: ' + score, W/2, 130);
    } else {
      const animSize = Math.max(10, Math.round(W * 0.018));
      ctx.textAlign = 'center';
      ctx.font = `${animSize}px 'Press Start 2P', monospace`;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('YOU DIED!', W/2, 30);
    }
  }

  // -------- UI MANAGEMENT --------
  const ui = document.getElementById('ui');
  const btnChar = document.getElementById('btnChar');
  const btnPlay = document.getElementById('btnPlay');

  function showUI() { ui.classList.remove('hidden'); }
  function hideUI() { ui.classList.add('hidden'); }

  function updatePlayButton() {
    if (selectedChar) {
      btnPlay.classList.remove('disabled');
      btnPlay.textContent = 'Play';
    } else {
      btnPlay.classList.add('disabled');
      btnPlay.textContent = 'Select a character first';
    }
  }

  btnChar.addEventListener('click', () => {
    if (state === 'title') { state = 'select'; hideUI(); updateSettingsButton(); }
  });
  btnPlay.addEventListener('click', () => {
    if (state === 'title' && selectedChar) {
      resetGame();
      state = 'game';
      hideUI();
      updateNukeButton();
      updateSettingsButton();
    }
  });

  // Settings menu exit button — closes the settings overlay and
  // returns to the title screen. The settings menu is shown by
  // clicking the gear button in the title-screen UI (see
  // restoreTitleButtons).
  const btnSettingsExit = document.getElementById('btnSettingsExit');
  btnSettingsExit.addEventListener('click', () => {
    hideSettings();
  });

  // Settings gear button (top-right corner of title screen) — opens
  // the settings menu. We get the reference from the static HTML; the
  // dynamic button created in restoreTitleButtons shares the same id,
  // so we re-fetch the reference each time. The dynamic button's
  // event listener handles clicks for new instances.
  const getBtnSettings = () => document.getElementById('btnSettings');
  getBtnSettings().addEventListener('click', () => {
    if (state === 'title') showSettings();
  });
  // Make sure it's visible/hidden correctly on initial load (state is
  // 'title' by default, so it should be visible)
  updateSettingsButton();

  // Click detection on character cards in selector screen,
  // and easter-egg detection on the "M" in the "MINECRAFT" logo
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    if (state === 'select') {
      // Character cards: positions scale with canvas width. Two cards
      // centered horizontally, each ~30% of W wide, with ~10% gap.
      const cardW = Math.round(W * 0.3);
      const cardGap = Math.round(W * 0.05);
      const totalW = cardW * 2 + cardGap;
      const cardLeft = (W - totalW) / 2;
      const steveX = cardLeft;
      const alexX = cardLeft + cardW + cardGap;
      const cardTop = 200;
      const cardBottom = cardTop + Math.round(cardW * 1.45);  // 200x320 ratio
      if (mx >= steveX && mx <= steveX + cardW && my >= cardTop && my <= cardBottom) {
        selectedChar = 'steve';
        state = 'title';
      } else if (mx >= alexX && mx <= alexX + cardW && my >= cardTop && my <= cardBottom) {
        selectedChar = 'alex';
        state = 'title';
      }
      updatePlayButton();
    } else if (state === 'title') {
      // Easter egg: click on the "M" in "MINECRAFT" logo.
      // Logo is drawn at W/2, mineY (text) and mineY+4 (shadow) with
      // a font that scales with W. Measure the text width to find
      // the start of "MINECRAFT", then check if the click landed
      // inside the "M" character. The hitbox scales with the font
      // size (proportional to W) so it stays consistent on phones.
      const logoSize = Math.max(24, Math.min(64, Math.round(W * 0.07)));
      const mineY = Math.round(logoSize * 2.0);
      ctx.font = `${logoSize}px 'Press Start 2P', monospace`;
      const logoWidth = ctx.measureText('MINECRAFT').width;
      const logoLeft = (W - logoWidth) / 2;
      // The "M" is the leftmost character. Allow a forgiving hit area
      // proportional to the logo size (was 60px when logoSize=64).
      const mWidth = Math.round(logoSize * 0.94);
      const mRight = logoLeft + mWidth;
      const mTop = mineY - Math.round(logoSize * 0.8);
      const mBottom = mineY + Math.round(logoSize * 0.6);
      if (mx >= logoLeft && mx <= mRight && my >= mTop && my <= mBottom) {
        easterEgg = !easterEgg;
        updateNukeButton();
      }
    }
  });

  // -------- TOUCH JUMP (mobile) --------
  // On desktop, the Space/Up/W keys trigger the jump (see keydown below).
  // On mobile, there's no keyboard — so a tap on the canvas does the same
  // thing. We use 'touchstart' (not 'click') so the jump fires instantly
  // without the 300ms tap delay, and we still let 'click' handle the
  // character-card / easter-egg-M hit tests above.
  canvas.addEventListener('touchstart', (e) => {
    if (state === 'game') {
      e.preventDefault();  // prevent the synthesized click from also firing
      if (onGround) {
        player.vy = JUMP_V;
        onGround = false;
      } else if (!doubleJumped) {
        player.vy = DBL_JUMP_V;
        doubleJumped = true;
      }
    }
  }, { passive: false });

  // Nuke button: only visible during gameplay when the easter egg is on
  function updateNukeButton() {
    const btnNuke = document.getElementById('btnNuke');
    if (!btnNuke) return;
    if (easterEgg && state === 'game' && !nukeActive) {
      btnNuke.classList.remove('hidden');
    } else {
      btnNuke.classList.add('hidden');
    }
  }
  document.getElementById('btnNuke').addEventListener('click', () => {
    if (!easterEgg || state !== 'game' || nukeActive) return;
    triggerNuke();
  });

  function triggerNuke() {
    nukeActive = true;
    nukeT = 0;
    nukeFalling = true;
    nukeParticles.length = 0;
    // Hide the button while the nuke is playing
    const btnNuke = document.getElementById('btnNuke');
    if (btnNuke) btnNuke.classList.add('hidden');
  }

  // Death screen buttons
  function showDeathButtons() {
    hideUI();
    ui.innerHTML = '';
    const again = document.createElement('button');
    again.className = 'btn';
    again.setAttribute('data-death', 'again');
    again.textContent = 'Play Again';
    again.addEventListener('click', () => {
      resetGame();
      state = 'game';
      hideUI();
      updateNukeButton();
      updateSettingsButton();
    });
    const menu = document.createElement('button');
    menu.className = 'btn';
    menu.setAttribute('data-death', 'menu');
    menu.textContent = 'Main Menu';
    menu.addEventListener('click', () => {
      state = 'title';
      hideUI();
      showUI();
      restoreTitleButtons();
      updateNukeButton();
      updateSettingsButton();
    });
    ui.appendChild(again);
    ui.appendChild(menu);
    showUI();
  }
  function restoreTitleButtons() {
    ui.innerHTML = '';
    const c = document.createElement('button');
    c.className = 'btn'; c.textContent = 'Character Selector';
    c.addEventListener('click', () => { if (state === 'title') { state = 'select'; hideUI(); updateSettingsButton(); } });
    const p = document.createElement('button');
    p.className = 'btn'; p.id = 'btnPlay'; p.textContent = 'Play';
    if (!selectedChar) p.classList.add('disabled');
    p.addEventListener('click', () => {
      if (state === 'title' && selectedChar) {
        resetGame(); state = 'game'; hideUI();
        updateNukeButton();
        updateSettingsButton();
      }
    });
    // Settings button (gear icon) — uses the same blue background and
    // same Press Start 2P font as the other title buttons (via .btnGear
    // CSS, which mirrors the .btn styling). Clicking it opens the
    // settings menu overlay.
    const s = document.createElement('button');
    s.className = 'btnGear';
    s.id = 'btnSettings';
    s.textContent = '⚙ Settings';
    s.addEventListener('click', () => {
      if (state === 'title') showSettings();
    });
    ui.appendChild(c);
    ui.appendChild(p);
    ui.appendChild(s);
    // Show or hide the gear button based on the current state
    updateSettingsButton();
  }

  // Show the settings menu overlay (semi-transparent panel with the
  // "SETTINGS" title, an empty body, and an Exit button). The settings
  // themselves will be added later — for now the body just says
  // "No settings yet".
  function showSettings() {
    document.getElementById('settingsMenu').classList.remove('hidden');
  }

  // Close the settings menu and return to the title screen.
  function hideSettings() {
    document.getElementById('settingsMenu').classList.add('hidden');
  }

  // Show or hide the settings gear button based on the current state.
  // The button only shows on the title screen — it's hidden during
  // character select, gameplay, and the death screen.
  function updateSettingsButton() {
    const btn = document.getElementById('btnSettings');
    if (!btn) return;
    if (state === 'title') {
      btn.classList.remove('hidden');
    } else {
      btn.classList.add('hidden');
    }
  }

  function maybeShowDeathButtons() {
    // Replace whatever buttons are in the UI with the death buttons, but
    // only if the death buttons aren't already there. The check is for
    // the SPECIFIC "Play Again" button (which only the death screen has).
    // We can't just check "any button" because the title buttons stay in
    // the DOM throughout (just hidden via CSS) and would always match.
    if (state === 'death' && !ui.querySelector('button[data-death]')) {
      showDeathButtons();
    }
  }

  // -------- INPUT --------
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (!e.repeat) {
        spacePressed = true;
        spaceWasPressed = false;
        if (state === 'game') {
          if (onGround) {
            player.vy = JUMP_V;
            onGround = false;
          } else if (!doubleJumped) {
            player.vy = DBL_JUMP_V;
            doubleJumped = true;
          }
        }
      }
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      spacePressed = false;
      spaceWasPressed = true;
      e.preventDefault();
    }
  });

  // -------- RENDER LOOP --------
  function render() {
    // Clear
    ctx.fillStyle = '#4A90E2';
    ctx.fillRect(0, 0, W, H);
    if (state === 'title') {
      drawTitle();
      showUI();
      updatePlayButton();
    } else if (state === 'select') {
      drawSelector();
    } else if (state === 'game') {
      drawGameScene();
    } else if (state === 'death') {
      drawDeath();
      maybeShowDeathButtons();
    }
    // Nuke overlay: drawn on top of whatever state is current so the
    // particles can keep falling even after state switches to 'title'
    // (the title is already drawn underneath by drawNuke itself).
    if (nukeActive) {
      drawNuke();
    }
  }

  function tick(time) {
    const dt = time - lastTime;
    lastTime = time;
    update(dt);
    render();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
